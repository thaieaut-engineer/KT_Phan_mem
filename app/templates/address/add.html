{% extends "base.html" %}

{% block title %}
Thêm địa chỉ - PetShop
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <h2 class="fw-bold mb-4">

                        <i class="bi bi-geo-alt"></i>

                        Thêm địa chỉ nhận hàng

                    </h2>


                    <form method="POST">


                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Tên người nhận

                            </label>

                            <input
                                type="text"
                                name="receiver_name"
                                class="form-control"
                                maxlength="100"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Số điện thoại

                            </label>

                            <input
                                type="tel"
                                name="phone"
                                class="form-control"
                                maxlength="20"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Địa chỉ

                            </label>

                            <textarea
                                name="address"
                                class="form-control"
                                rows="4"
                                required
                            ></textarea>

                        </div>


                        <div class="form-check mb-4">

                            <input
                                type="checkbox"
                                name="is_default"
                                value="1"
                                class="form-check-input"
                                id="isDefault"
                            >

                            <label
                                class="form-check-label"
                                for="isDefault"
                            >

                                Đặt làm địa chỉ mặc định

                            </label>

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-petshop"
                            >

                                <i class="bi bi-check-circle"></i>

                                Lưu địa chỉ

                            </button>


                            <a
                                href="{{ url_for('address.index') }}"
                                class="btn btn-outline-dark"
                            >

                                Hủy

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
